let selectedCategory="All";

function money(n){
return "UGX "+n.toLocaleString("en-UG");
}

function display(list){

const box=document.getElementById("products");

if(!list.length){

box.innerHTML=`
<div style="grid-column:1/-1;text-align:center;padding:60px">
<h2>No footwear found</h2>
<p>Try another search or filter.</p>
</div>`;

}else{

box.innerHTML=list.map((p,i)=>`

<div class="product" style="animation-delay:${i*40}ms">

<div class="product-image">

<img src="${p.image}" loading="lazy">

<span class="badge">
${p.badge}
</span>

</div>

<div class="product-info">

<div class="meta">
${p.gender} • ${p.category}
</div>

<h3>
${p.name}
</h3>

<div class="price">
${money(p.price)}
</div>

<div class="stock ${p.stock?"in":"out"}">
${p.stock ? p.stock+" in stock":"Out of stock"}
</div>

<button class="add" onclick="addCart()">
ADD TO CART
</button>

</div>

</div>

`).join("");

}

document.getElementById("result").textContent=
list.length+" product"+(list.length===1?"":"s");

}

function filterProducts(){

const query=
document.getElementById("search").value.toLowerCase();

const size=
document.getElementById("size").value;

const stockOnly=
document.getElementById("stock").checked;

const genders=
[...document.querySelectorAll('input[name="gender"]:checked')]
.map(x=>x.value);

let result=products.filter(p=>{

const text=
(p.name+" "+p.category+" "+p.gender)
.toLowerCase();

const queryWords=query.split(/\s+/).filter(Boolean);

const searchOK=
queryWords.every(word=>{

const number=Number(word);

if(number>=35 && number<=46){
return p.size.includes(number);
}

return text.includes(word);

});

const categoryOK=
selectedCategory==="All" ||
p.category===selectedCategory;

const genderOK=
!genders.length ||
genders.includes(p.gender);

const sizeOK=
size==="All" ||
p.size.includes(Number(size));

const stockOK=
!stockOnly ||
p.stock>0;

return searchOK &&
categoryOK &&
genderOK &&
sizeOK &&
stockOK;

});

display(result);

}

function categoryFilter(category,button){

selectedCategory=category;

document
.querySelectorAll(".category")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

filterProducts();

document
.getElementById("shop")
.scrollIntoView({behavior:"smooth"});

}

let cartCount=0;

function addCart(){

cartCount++;

document.getElementById("cartCount").textContent=cartCount;

}

display(products);
